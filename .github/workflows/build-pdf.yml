name: Build resume PDF

on:
  push:
    branches:
      - master
    paths-ignore:
      - resumeMandra.pdf
      - .github/workflows/build-pdf.yml

permissions:
  contents: write

concurrency:
  group: build-resume-pdf
  cancel-in-progress: true

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PDF
        run: node generate-pdf.js "file://${{ github.workspace }}/index.html" resumeMandra.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resumeMandra.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
          else
            git commit -m "Update generated resume PDF [skip ci]"
            git push
          fi
